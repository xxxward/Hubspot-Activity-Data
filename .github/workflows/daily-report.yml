name: Daily Activity Report (4:30 PM MST)

on:
  schedule:
    # 4:30 PM Mountain Time year-round (both entries cover DST transitions):
    #   22:30 UTC = 4:30 PM MDT (Mar–Nov)  — runs Mon-Fri MDT
    #   23:30 UTC = 4:30 PM MST (Nov–Mar)  — runs Mon-Fri MST
    - cron: "30 22 * * 1-5"
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        type: choice
        default: "preview"
        options:
          - preview
          - test-single-rep
          - production
      test_rep:
        description: "Rep name (only for test-single-rep mode, e.g. Brad Sherman)"
        required: false
        default: ""

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hubspot-analytics

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: hubspot-analytics/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily report
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GONG_ACCESS_KEY: ${{ secrets.GONG_ACCESS_KEY }}
          GONG_SECRET_KEY: ${{ secrets.GONG_SECRET_KEY }}
          GONG_BASE_URL: ${{ secrets.GONG_BASE_URL }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "preview" ]; then
            python daily_report.py --test-all
          elif [ "$MODE" = "test-single-rep" ] && [ -n "${{ github.event.inputs.test_rep }}" ]; then
            python daily_report.py --test "${{ github.event.inputs.test_rep }}"
          else
            python daily_report.py
          fi
